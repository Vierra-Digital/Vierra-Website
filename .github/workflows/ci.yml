name: CI

# Node/Next equivalent of rena-control's python-checks: the code-quality gate that runs on every
# PR. Type-check + lint + unit tests are deterministic and need no env/DB. The production `next
# build` is intentionally NOT run here — Netlify builds on deploy with real env, so duplicating it
# would only add flakiness.

on:
  pull_request:
    types:
      - opened
      - edited
      - reopened
      - synchronize

jobs:
  quality:
    runs-on: ubuntu-latest
    # Dummy value so `prisma generate` never trips on an unset env("DATABASE_URL"); nothing here
    # connects to a database.
    env:
      DATABASE_URL: "postgresql://user:pass@localhost:5432/db"
    steps:
      - name: Checkout code
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Set up Node
        # Pinned by SHA like the other actions here. v5 moved the action itself onto node24;
        # on v4 every run logged "Node.js 20 is deprecated ... forced to run on Node.js 24".
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Node 20 left maintenance in April 2026, so CI was gating on an end-of-life runtime
          # while development happens on 24. Keep these on the same major.
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npx eslint .

      - name: Unit tests + coverage
        run: npm run test:coverage
