[build]
  # The build generates the Prisma client but deliberately does not run migrations.
  #
  # The migration history has since been baselined, so `migrate deploy` no longer fails — it
  # reports no pending migrations. It stays out of the build anyway: schema.prisma does not model
  # everything the live database has (objects applied by hand, plus prisma/manual/*.sql), so schema
  # changes are applied to the database directly and deliberately, never as a side effect of a
  # deploy. The build only needs the generated client.
  command = "npx prisma generate && npm run build"
  publish = ".next"
  # Skip the build entirely when a push cannot change the deployed site (tests, CI config, docs).
  # Netlify bills per build minute in every context and runs a deploy preview on every push to
  # every open PR, so those pushes were each costing a full build for no deployable difference.
  # The script fails open: anything it does not recognise as non-deployable still builds.
  ignore = "bash netlify-ignore.sh"

[build.environment]
  NODE_OPTIONS = "--max-old-space-size=4096"
  # Node itself is pinned by .nvmrc, which Netlify reads automatically — not repeated here, so
  # there is one place to change it. Without it Netlify picked its own default (22.23.2) while
  # CI and local dev were on a different major.

[functions]
  included_files = ["data/presets/**"]

[[plugins]]
  package = "@netlify/plugin-nextjs"

# After each production deploy goes live, warm the ISR cache for the blog index
# and recent posts so the first real visitor doesn't pay the cold regeneration
# (cold function + cold Supabase connection). Best-effort; never fails the build.
[[plugins]]
  package = "/plugins/warm-blog-cache"

[context.production.environment]
  NEXT_PUBLIC_SITE_URL = "https://vierradev.com"

# Static files (robots.txt, IndexNow key, etc.) are served by Netlify's edge and
# bypass the Next.js headers() config, so set HSTS here to match the app routes.
[[headers]]
  for = "/*.txt"
  [headers.values]
    Strict-Transport-Security = "max-age=63072000; includeSubDomains"
